;-----------------------------------------------------------------------------
; Settings - Cubic Polynomial Curve Fitting Library
;-----------------------------------------------------------------------------

[global]
bgi_path = "..\BGI"

;-----------------------------------------------------------------------------
; Curve Fitting Settings
;-----------------------------------------------------------------------------

[curve]

interpolation_count     = 10
color_fitted_curve      = 2
color_sample_point      = 10
color_sample_point_size = 3

;-----------------------------------------------------------------------------
; Graph Settings
;-----------------------------------------------------------------------------

[graph]

; Axis range

horizontal_axis_range_min    = -0.2
horizontal_axis_range_max    =  0.8
horizontal_axis_range_step   =  0.1

vertical_axis_range_min      = -0.6
vertical_axis_range_max      =  1.0
vertical_axis_range_step     =  0.1

; Colours
;
;  0 = Black
;  1 = Blue
;  2 = Green
;  3 = Cyan
;  4 = Red
;  5 = Magenta
;  6 = Brown
;  7 = LightGray
;  8 = DarkGray
;  9 = LightBlue
; 10 = LightGreen
; 11 = LightCyan
; 12 = LightRed
; 13 = LightMagenta
; 14 = Yellow
; 15 = White

color_background             = 8
color_chart_area             = 0
color_chart_border           = 7
color_data_points            = 15
color_data_line              = 2
color_text                   = 7
color_origin_axis            = 8

; Visibility
;
; 0 = False
; 1 = True

origin_axis_visible          = 1
tick_mark_vertical_visible   = 1
tick_mark_horizontal_visible = 1
data_point_visible           = 1
data_line_visible            = 1

; Tick marks Fonts
;
;  0 = Default
;  1 = Triplex
;  2 = Small
;  3 = SansSerif
;  4 = Gothic
;  5 = Script
;  6 = Simplex
;  7 = TriplexScript
;  8 = Complex
;  9 = European
; 10 = Bold

tick_mark_vertical_size      = 3
tick_mark_horizontal_size    = 3
tick_mark_font               = 0
tick_mark_font_size          = 1

; Chart margins (pixels)

chart_margin_left            = 50
chart_margin_bottom          = 30
chart_margin_top             = 20
chart_margin_right           = 20

; Data styling

data_point_size              = 2
data_line_thickness          = 1
